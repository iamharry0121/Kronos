<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Main Page</title>
    <script src="{{ url_for('static', filename='scripts.js')}}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='main_page.css')}}">
</head>
<body>
    <div class="tasks">  
        <form method="POST">
            {{form.hidden_tag()}}
            <div>
                {{form.task.label}}
                {{form.task()}}
            </div>
            <div>
                <br>
                {{form.submit()}}
            </div>
        </form>
    </div>
    <div>
        <p>Tasks Inputted:<br></p>
        {% for item in values%}
            <div class="task_management">
                <span class="task-text">{{loop.index}}. {{ item.task }}</span>
                <form action="{{ url_for('delete_task', task_id=item.id)}}" method="POST">
                    <button type="submit" class="delete-btn">Delete</button>
                </form>
            </div>
        {% else %}
            <p>No tasks added yet.</p>
        {% endfor %} <!--ends the for loop, hence 'endfor'-->

    </div>
    
</body>
</html>
